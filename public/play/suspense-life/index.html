<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>2:17 AM — Private Prototype</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f2f1ed;min-height:100vh;display:grid;place-items:center}.game{width:min(100%,520px);min-height:100vh;background:#111722;box-shadow:0 0 80px #0008;display:flex;flex-direction:column}.art{height:39vh;min-height:220px;position:relative;overflow:hidden;background:linear-gradient(160deg,#162c3c,#0c101b 70%)}.art:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#111722)}.window{position:absolute;top:15%;left:16%;width:33%;height:60%;border:12px solid #171e27;background:linear-gradient(140deg,#263e54,#111b2a);box-shadow:0 0 45px #6989b322}.door{position:absolute;right:12%;top:10%;width:30%;height:85%;border:9px solid #332a2a;background:linear-gradient(90deg,#2b292f,#161b25);box-shadow:0 0 30px #000}.door:after{content:'';position:absolute;right:10%;top:53%;width:7px;height:7px;border-radius:50%;background:#e8b76c}.clock{position:absolute;top:18px;left:22px;font-weight:800;letter-spacing:4px;color:#d7e3e9;z-index:1}.scene{padding:22px;flex:1;display:flex;flex-direction:column}.eyebrow{font-size:11px;letter-spacing:2px;color:#8eb3bc;text-transform:uppercase}.scene h1{font-size:27px;margin:8px 0 14px}.story{white-space:pre-line;line-height:1.85;color:#e1e3e6;min-height:112px}.stats{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.stat{font-size:12px;background:#202b38;border:1px solid #35404c;padding:7px 10px;border-radius:30px}.choices{margin-top:auto;display:grid;gap:10px}button{font:inherit;text-align:left;padding:14px 16px;border:1px solid #465264;border-radius:12px;background:#202c3c;color:#fff;cursor:pointer}button:hover,button:focus-visible{background:#344a62;outline:2px solid #8cb0d0}footer{padding:12px 22px 20px;color:#8998a8;font-size:11px}.ending{color:#d5b77e}a{color:#b1c9e7}
</style></head><body><main class="game"><div class="art" aria-hidden="true"><div class="window"></div><div class="door"></div><div class="clock">02:17</div></div><section class="scene"><div class="eyebrow">GameVado / Unreleased prototype / Chapter 01</div><h1 id="title"></h1><div class="story" id="story" aria-live="polite"></div><div class="stats"><span class="stat" id="nerve"></span><span class="stat" id="clue"></span></div><div class="choices" id="choices"></div></section><footer>Original fiction · No external AI calls · Local save only · Private review build</footer></main>
<script>
'use strict';
const scenes={
start:{title:'A Message From Yourself',text:'You moved into Apartment 407 three days ago.\nAt 2:17 AM, your phone lights up.\n\nSender: YOUR NUMBER\n“Do not open the door tonight. The person outside is you, tomorrow.”\n\nA key turns slowly in the lock.',choices:[['Check the peephole','peephole',-1,1],['Read the message details','message',0,1],['Call the police','police',-1,0]]},
peephole:{title:'The Peephole',text:'A figure stands motionless outside. It wears your coat. Its face is hidden.\n\nOn the floor: a wet footprint, pointing toward the door.',choices:[['Ask who is there','voice',-1,0],['Step away and inspect the window','window',0,1],['Open the door','bad',-2,0]]},
message:{title:'A Timestamp From Tomorrow',text:'The message metadata shows tomorrow’s date. There is also an attachment: a photo of your front door.\n\nIn the photo, the door is open. A clock reads 02:18.',choices:[['Inspect the window','window',0,1],['Reply: “Prove it”','voice',-1,1],['Open the door now','bad',-2,0]]},
police:{title:'No Signal',text:'The call connects, but you hear your own voice answering: “You have one minute.”\n\nThen the line goes dead.',choices:[['Look through the peephole','peephole',-1,1],['Search the apartment','window',0,1]]},
voice:{title:'The Familiar Voice',text:'From the hallway: “I made the wrong choice yesterday. Please, let me fix it.”\n\nThe voice is unmistakably yours. It knows a secret you have never told anyone.',choices:[['Demand the secret','secret',0,1],['Open the door','bad',-2,0],['Lock the door and wait','wait',1,0]]},
window:{title:'The Balcony',text:'Beyond the curtain, the apartment block opposite is dark. One window glows: Apartment 407, exactly like yours.\n\nA silhouette in that window is watching you.',choices:[['Photograph the opposite window','proof',0,1],['Pull the curtains and wait','wait',1,0],['Return to the door','voice',-1,0]]},
secret:{title:'The Detail',text:'“The scar on your left palm is not from the accident. You got it tomorrow.”\n\nYou look down. A thin new cut has appeared.',choices:[['Photograph the scar','proof',0,1],['Let the visitor in','bad',-2,0],['Stay inside until sunrise','wait',1,0]]},
proof:{title:'The Evidence',text:'Your camera captures the impossible: the figure across the street is holding a phone showing the exact same image.\n\nYour screen displays one final message: “Keep the evidence. Do not let the loop reset.”',choices:[['Save the evidence and wait','good',0,1],['Delete everything','loop',0,-1]]},
wait:{title:'The Longest Minute',text:'The lock stops turning. Footsteps retreat. At 2:18 AM, every clock in the room freezes.\n\nYour phone vibrates one last time.',choices:[['Read the final message','ending',0,0],['Open the door after the footsteps fade','bad',-2,0]]},
ending:{title:'Ending: The Unanswered Door',text:'“Tomorrow, do better.”\n\nMorning arrives. The hallway is empty, except for one wet footprint.\n\nYou survived, but the message remains unexplained.',end:true},
good:{title:'Ending: The Witness',text:'You keep the photograph and refuse to open the door.\n\nAt sunrise, the opposite apartment disappears from view. The evidence remains on your phone.\n\nFor the first time, the loop has a witness.',end:true},
bad:{title:'Ending: The Replacement',text:'The door opens.\n\nYou see yourself—older by one day, exhausted, relieved.\n\n“Thank you,” the visitor whispers.\n\nWhen you wake, you are standing in the hallway.',end:true},
loop:{title:'Ending: 2:17 Again',text:'You erase the photograph. The clock ticks backward.\n\nYour phone lights up.\nSender: YOUR NUMBER.\n\n“Do not open the door tonight.”',end:true}
};
const key='gamevado-217-prototype-v1';let state={id:'start',nerve:5,clues:0};try{const old=JSON.parse(localStorage.getItem(key));if(old&&scenes[old.id])state=old}catch{}
const $=id=>document.getElementById(id);function render(){const s=scenes[state.id];$('title').textContent=s.title;$('story').textContent=s.text;$('nerve').textContent='Composure: '+state.nerve;$('clue').textContent='Clues: '+state.clues;const root=$('choices');root.replaceChildren();(s.end?[['Play again','start',0,0]]:s.choices).forEach(([label,id,n,c])=>{const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>{if(s.end){state={id:'start',nerve:5,clues:0}}else{state={id,nerve:Math.max(0,state.nerve+n),clues:Math.max(0,state.clues+c)};if(state.nerve===0)state.id='bad'}try{localStorage.setItem(key,JSON.stringify(state))}catch{}render()});root.append(b)})}render();
</script></body></html>
