<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅人的小屋</title><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="avatar.css"></head><body><canvas id="homeWorld" aria-label="可进入与布置的三维旅人小屋"></canvas><header><div class="brand">✧ 旅人的小屋<small>A PLACE TO COME HOME TO</small></div><div class="tools"><button id="viewMode">走进屋里</button><a href="adventure.html?map=1">出门探索 ↗</a></div></header><aside><p class="eyebrow">THE LITTLE THINGS WE BRING HOME</p><h1>把走过的远方，<br>慢慢变成家。</h1><p id="lights"></p><p class="quiet">星光留在屋外，物品安放屋内。<br>交换家具不会消耗星光。</p><div id="materials"></div><h2>还想带回家的东西</h2><div id="wishlist"></div><p class="quiet">在关卡角落发现往事，会找到当地材料。<br>与 NPC 交谈，可交换他珍藏的小物。</p></aside><section id="furnish"><h2>屋内布置</h2><label for="item">行囊中的物品</label><select id="item"></select><label for="slot">摆放位置</label><select id="slot"><option value="0">地板 · 左前</option><option value="1">地板 · 右前</option><option value="2">窗边 · 左后</option><option value="3">音乐桌旁</option><option value="4">收藏架 · 左</option><option value="5">收藏架 · 右</option></select><div class="row"><button id="place">摆放到这里</button><button id="pack">收进行囊</button></div><p class="quiet">点击室内的摆放点也能选择位置。<br>替换物品后，旧物仍留在行囊中。</p><button id="wardrobe">衣柜 · 捏脸换装</button><a class="music" href="music.html">音乐桌 · 自由作曲 ♫</a></section><div id="message" role="status"></div><footer>拖动画面环视小屋 · 屋内点击衣柜换装、音乐桌作曲</footer><script type="module" src="home.js"></script><script type="module" src="avatar-ui.js"></script></body></html>
